<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Nikita Bulava</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: { ink: '#121212' } } }
  }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>html, body { margin: 0; height: 100%; }</style>
</head>
<body class="bg-white dark:bg-ink">

<a href="index.html" title="Back to site" class="fixed top-4 left-4 z-50 flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-ink/80 backdrop-blur text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white shadow-sm">
  <i class="fas fa-arrow-left text-sm"></i>
</a>

<div class="fixed top-4 right-4 z-50 flex items-center gap-2">
  <a id="downloadLink" href="resume/Resume%20EN.pdf" download title="Download PDF" class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-ink/80 backdrop-blur text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white shadow-sm">
    <i class="fas fa-download text-sm"></i>
  </a>
  <div class="flex items-center gap-1 rounded-full border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-ink/80 backdrop-blur p-1 shadow-sm">
    <button type="button" id="langEN" class="px-3 py-1 rounded-full text-xs font-semibold transition-colors">EN</button>
    <button type="button" id="langRU" class="px-3 py-1 rounded-full text-xs font-semibold transition-colors">RU</button>
  </div>
</div>

<iframe id="resumeFrame" class="block w-screen h-screen border-0" title="Resume"></iframe>

<script>
  const files = { en: 'resume/Resume EN.pdf', ru: 'resume/Resume RU.pdf' };
  const frame = document.getElementById('resumeFrame');
  const downloadLink = document.getElementById('downloadLink');
  const btns = { en: document.getElementById('langEN'), ru: document.getElementById('langRU') };
  const activeClass = ['bg-ink', 'text-white', 'dark:bg-white', 'dark:text-black'];
  const inactiveClass = ['text-gray-500', 'dark:text-gray-400', 'hover:text-gray-900', 'dark:hover:text-white'];

  function setLang(lang) {
    const file = files[lang];
    // PDF open parameters (view=Fit) tell the browser's built-in viewer to scale
    // the whole page to fit the window instead of opening at 100% zoom.
    frame.src = encodeURI(file) + '#view=Fit';
    downloadLink.href = encodeURI(file);
    Object.entries(btns).forEach(([key, btn]) => {
      btn.classList.remove(...activeClass, ...inactiveClass);
      btn.classList.add(...(key === lang ? activeClass : inactiveClass));
    });
  }

  btns.en.addEventListener('click', () => setLang('en'));
  btns.ru.addEventListener('click', () => setLang('ru'));
  setLang('en');
</script>

</body>
</html>
